<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- Game Controller Icon -->
  <g transform="translate(200, 100)">
    <!-- Controller body outline -->
    <rect x="-60" y="-30" width="120" height="60" rx="20" fill="none" stroke="#FFD700" stroke-width="2"/>
    
    <!-- Left button group (D-pad simulation) -->
    <circle cx="-40" cy="-10" r="6" fill="#FFD700"/>
    <circle cx="-40" cy="10" r="6" fill="#FFD700"/>
    <circle cx="-50" cy="0" r="6" fill="#FFD700"/>
    <circle cx="-30" cy="0" r="6" fill="#FFD700"/>
    
    <!-- Right button group -->
    <circle cx="30" cy="-10" r="6" fill="#FFD700"/>
    <circle cx="30" cy="10" r="6" fill="#FFD700"/>
    <circle cx="40" cy="0" r="6" fill="#FFD700"/>
    <circle cx="20" cy="0" r="6" fill="#FFD700"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="18" fill="#FFD700" text-anchor="middle" font-weight="bold">
    Ảnh không tải được
  </text>
  <text x="200" y="255" font-family="Arial, sans-serif" font-size="14" fill="#999" text-anchor="middle">
    Vui lòng kiểm tra kết nối
  </text>
</svg>